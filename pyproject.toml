[project]
name = "winflow"
version = "1.1.0"
description = "Minimalist AI Voice Dictation for Windows 10/11 (Alt+X) with Groq Cloud Turbo, Offline Whisper, and Tactile Sound UI"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "pystray>=0.19.5",
    "pywebview>=5.0.0",
    "sounddevice>=0.5.0",
]
