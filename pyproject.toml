[project]
name = "winflow"
version = "1.0.0"
description = "Native Windows Wispr-Flow-style Speech-to-Text with Win+H hook, AI filler cleanup, and Cloud/Local switching"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "pystray>=0.19.5",
    "sounddevice>=0.5.0",
]
