name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Win32 Hook & Engine Tests (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12 & dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv\Scripts\python.exe -r pyproject.toml

      - name: Syntax & bytecode check
        run: .\.venv\Scripts\python.exe -m compileall winflow run_winflow.py tests

      - name: Run Windows CI unit tests
        run: .\.venv\Scripts\python.exe tests\unit_test.py
