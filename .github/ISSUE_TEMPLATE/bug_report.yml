name: Bug Report
description: Report a bug, shortcut issue, or transcription problem in WinFlow
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Briefly describe the issue you encountered.
      placeholder: e.g., Pressing Alt + X inside App XYZ didn't paste the text...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Active Engine Mode
      options:
        - Free Cloud API (Groq)
        - Free Cloud API (Google Gemini)
        - 100% Offline Local Whisper
    validations:
      required: true
  - type: input
    id: windows_version
    attributes:
      label: Windows Version
      placeholder: e.g., Windows 11 24H2 (x64)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant winflow.log output (optional)
      render: text
